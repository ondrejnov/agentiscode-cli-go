name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.goos }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            extension: ''
          - os: windows-latest
            goos: windows
            extension: '.exe'
          - os: macos-latest
            goos: darwin
            extension: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build binaries
        env:
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          EXTENSION: ${{ matrix.extension }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X agentiscode.Version=${TAG#v}" \
              -o "dist/agentiscode_${TAG}_${GOOS}_${arch}${EXTENSION}" \
              ./cmd/agentiscode
          done
          "./dist/agentiscode_${TAG}_${GOOS}_$(go env GOHOSTARCH)${EXTENSION}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum agentiscode_* > SHA256SUMS
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* --verify-tag \
              --title "$TAG" --generate-notes "${flags[@]}"
          fi
